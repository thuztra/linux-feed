name: Feed refresh

# The trigger for the Linux update-feed refresh (update-feed-design.md rev 5.4, 5.5). It lives in
# the public feed repo with sign-refresh.yml, the pinned signer it calls. GitHub writes the OIDC
# job_workflow_ref claim only for a called workflow, so the trigger sits here and the signer runs
# as a called workflow at a 40-hex SHA of this repo; the WIF condition pins that SHA (4.5).
# Setup (Ted, step 7): replace both TODO-SETUP parts with the public repo's name and the SHA of
# the commit that holds sign-refresh.yml. Each signer change moves this pin and the WIF SHA list.
# GitHub turns off a schedule after 60 days with no activity in a public repo (5.5, residual R-8).
# Every second day of the month: the gap is never more than 2 days (31 -> 1 is 1 day).

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  refresh:
    permissions:
      id-token: write
      contents: read
    uses: thuztra/linux-feed/.github/workflows/sign-refresh.yml@e10b12d1c08c11e4e1417c0504839c4b3267ae8e
